<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e1f22">
<title>Vesper</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" data-panel="center">
  <aside id="left"><nav id="rail"></nav><section id="chlist"></section></aside>
  <aside id="right"></aside>
  <main id="center">
    <header id="chhead"></header>
    <div id="feed"></div>
    <div id="replybar" hidden></div>
    <footer id="composer">
      <button id="plus" aria-label="Attach">+</button>
      <div class="pill"><input id="msg" placeholder="Message" autocomplete="off"><button id="emoji" aria-label="Emoji">😄</button></div>
      <button id="send" aria-label="Send">🎤</button>
    </footer>
  </main>
  <section id="page" hidden></section>
  <nav id="tabs"></nav>
</div>
<script type="module" src="index.js"></script>
</body>
</html>
